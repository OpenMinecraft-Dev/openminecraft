name: Build OpenMinecraft native version
on: [push, pull_request]
env:
  LINK_JOBS: 16
  JOBS: 16
  MODE: debug
  XMAKE_ARGS: -v
  ANDROID_NDK_VERSION: r27c
  OHOS_SDK_VERSION: 5.0.0-Release
  CROSS_TOOL_VERSION: toolchain-20260214-6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (x64)
            plat: windows
            arch: x64
            loaderarch: x64

          - os: windows-latest
            name: Windows (x86)
            plat: windows
            arch: x86
            loaderarch: x86

          - os: windows-latest
            name: Windows (arm64)
            plat: windows
            arch: arm64
            loaderarch: arm64

          # - os: ubuntu-22.04
          #   name: OpenHarmony (arm64)
          #   plat: harmony
          #   arch: arm64-v8a
          #   loaderarch: arm64

          # - os: ubuntu-22.04
          #   name: OpenHarmony (arm32)
          #   plat: harmony
          #   arch: armeabi-v7a
          #   loaderarch: arm32

          # - os: ubuntu-22.04
          #   name: OpenHarmony (x64)
          #   plat: harmony
          #   arch: x86_64
          #   loaderarch: x64

          - os: ubuntu-22.04
            name: Android (arm64)
            plat: android
            arch: arm64-v8a
            loaderarch: arm64

          - os: ubuntu-22.04
            name: Android (arm32)
            plat: android
            arch: armeabi-v7a
            loaderarch: arm32

          - os: ubuntu-22.04
            name: Android (x64)
            plat: android
            arch: x86_64
            loaderarch: x64

          - os: ubuntu-22.04
            name: Linux (x64)
            plat: linux
            arch: x64
            loaderarch: x64

          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            plat: linux
            arch: arm64
            loaderarch: arm64

          - os: ubuntu-latest
            name: Linux (LoongArch Cross)
            plat: linux-cross
            arch: loong64
            loaderarch: loong64

          - os: ubuntu-latest
            name: Linux (RISCV Cross)
            plat: linux-cross
            arch: riscv64
            loaderarch: riscv64

          - os: ubuntu-latest
            name: Linux (S390X Cross)
            plat: linux-cross
            arch: s390x
            loaderarch: s390x

          - os: ubuntu-latest
            name: Linux (PowerPC Cross)
            plat: linux-cross
            arch: ppc64
            loaderarch: ppc64

          - os: macos-latest
            name: MacOS (arm64)
            plat: macos
            arch: arm64
            loaderarch: arm64

          - os: macos-15-intel
            name: MacOS (x64)
            plat: macos
            arch: x64
            loaderarch: x64

          - os: macos-latest
            name: IOS
            plat: ios
            arch: arm64
            loaderarch: arm64

          - os: ubuntu-latest
            name: FreeBSD (x86_64)
            plat: freebsd
            arch: x86_64
            loaderarch: x64


    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: macos test
        if: matrix.plat == 'macos'
        run: |
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-jit bool true" jit.entitlements
          gcc -g -std=c17 -Wall -Wdeprecated -Wpedantic -Wextra -o ./jit ./misc/jit.c
          codesign -s - -f --entitlements jit.entitlements jit
          lldb -o r -o exit ./jit
          rm jit

      - name: Install xmake
        if: matrix.plat != 'freebsd'
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install xmake from source
        if: matrix.plat == 'freebsd'
        run: |
          git clone https://github.com/OpenMinecraft-Dev/xmake
          cd xmake
          git submodule update --recursive --init
          ./scripts/get.sh __local__
          source ~/.xmake/profile

      - name: Setup Python packages
        run: pip install wheel

      - name: Cache xmake results (UNIX)
        uses: actions/cache@v4
        if: matrix.plat != 'windows'
        with:
          path: ~/.xmake/packages
          key: ${{ matrix.plat }}-${{ matrix.arch }}-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: ${{ matrix.plat }}-${{ matrix.arch }}-xmake-${{ hashFiles('xmake.lua') }}

      - name: Cache xmake results (Windows)
        uses: actions/cache@v4
        if: matrix.plat == 'windows'
        with:
          path: C:/Users/runneradmin/AppData/Local/.xmake/packages
          key: ${{ matrix.plat }}-${{ matrix.arch }}-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: ${{ matrix.plat }}-${{ matrix.arch }}-xmake-${{ hashFiles('xmake.lua') }}

      - name: Generate header
        run: |
          xmake f -yc ${{ env.XMAKE_ARGS }}
          xmake -b openminecraft-bundlemaker
          xmake run -w . openminecraft-bundlemaker -a Cyrene -c -t res.bundle -P bootassets
          xxd -i res.bundle > include/openminecraft/resource/bootassets.h
          rm res.bundle

      - name: Setup OpenHarmony SDK
        if: matrix.plat == 'harmony'
        run: |
          wget https://repo.huaweicloud.com/openharmony/os/${{ env.OHOS_SDK_VERSION }}/ohos-sdk-windows_linux-public.tar.gz
          tar -zxvf ohos-sdk-windows_linux-public.tar.gz
          unzip linux/native*.zip

      - name: Setup Android NDK
        if: matrix.plat == 'android'
        run: |
          wget https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip
          unzip android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip

      - name: Configure MacOS
        if: matrix.plat == 'macos'
        run: xmake f -m ${{ env.MODE }} --cxx="clang++" -yc ${{ env.XMAKE_ARGS }}

      - name: Configure IOS
        if: matrix.plat == 'ios'
        run: xmake f -p iphoneos -m ${{ env.MODE }} --cc="clang" -yc ${{ env.XMAKE_ARGS }}
          
      - name: Configure OpenHarmony
        if: matrix.plat == 'harmony'
        run: xmake f -p harmony -a ${{ matrix.arch }} --sdk=${{ github.workspace }}/native -m ${{ env.MODE }} -yc ${{ env.XMAKE_ARGS }}

      - name: Configure Android
        if: matrix.plat == 'android'
        run: xmake f -p android -a ${{ matrix.arch }} --ndk=${{ github.workspace }}/android-ndk-${{ env.ANDROID_NDK_VERSION }} -m ${{ env.MODE }} -yc ${{ env.XMAKE_ARGS }} --cxxflags="-fPIC"

      - name: Configure Linux
        if: ${{ matrix.plat == 'linux' }}
        run: |
          sudo apt update
          sudo apt install libgl1-mesa-dev
          xmake f -a ${{ matrix.arch }} -m ${{ env.MODE }} -yc ${{ env.XMAKE_ARGS }}

      - name: Configure Linux Cross
        if: ${{ matrix.plat == 'linux-cross' }}
        run: |
          sudo apt update
          sudo apt install clang llvm
          wget https://github.com/OpenMinecraft-Dev/cross-toolchain-sysroot/releases/download/${{ env.CROSS_TOOL_VERSION }}/llvm-toolchain-linux-debian-${{ matrix.arch }}.tar.xz
          mkdir toolchain
          tar -xJf llvm-toolchain-linux-debian-${{ matrix.arch }}.tar.xz -C ./toolchain/
          rm llvm-toolchain-linux-debian-${{ matrix.arch }}.tar.xz

          xmake f --toolchain=llvm --sdk=${{ github.workspace }}/toolchain -a ${{ matrix.arch }} -m ${{ env.MODE }} -yc ${{ env.XMAKE_ARGS }}
      - name: Configure FreeBSD Cross
        if: ${{ matrix.plat == 'freebsd' }}
        run: |
          sudo apt update
          sudo apt install clang llvm
          wget https://github.com/OpenMinecraft-Dev/cross-toolchain-sysroot/releases/download/${{ env.CROSS_TOOL_VERSION }}/llvm-toolchain-freebsd-${{ matrix.arch }}.tar.xz
          mkdir toolchain
          tar -xJf llvm-toolchain-freebsd-${{ matrix.arch }}.tar.xz -C ./toolchain/
          rm llvm-toolchain-freebsd-${{ matrix.arch }}.tar.xz

          xmake f --toolchain=llvm --sdk=${{ github.workspace }}/toolchain -a ${{ matrix.arch }} -m ${{ env.MODE }} -p bsd --target_os=FreeBSD -yc ${{ env.XMAKE_ARGS }}

      - name: Configure Windows
        if: matrix.plat == 'windows'
        run: xmake f --toolchain=msvc -a ${{ matrix.arch }} -m ${{ env.MODE }} -yc ${{ env.XMAKE_ARGS }}

      - name: Build
        run: xmake -y --jobs=${{ env.JOBS }} --linkjobs=${{ env.LINK_JOBS }} ${{ env.XMAKE_ARGS }}

      - name: Xmake Install
        run: xmake install -o prod ${{ env.XMAKE_ARGS }} openminecraft

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.plat }}-${{ matrix.loaderarch }}
          path: prod/
 
